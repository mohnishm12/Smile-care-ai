# =============================================================================
# HealFlow AI — Backend CI/CD Pipeline
# Lint → Type Check → Test → Build → Push to Docker Hub
# =============================================================================

name: Backend CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - "healflow-backend/**"
      - "healflow-devops/ci-cd/backend-ci.yml"
      - "healflow-devops/docker/Dockerfile.backend"
      - "healflow-devops/docker/Dockerfile.celery"
      - "healflow-devops/docker-compose.yml"
  pull_request:
    branches: [develop]
    paths:
      - "healflow-backend/**"

env:
  REGISTRY: docker.io
  IMAGE_NAME: mohnishm12/healflow-backend
  CELERY_IMAGE_NAME: mohnishm12/healflow-celery
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd healflow-backend
          pip install ruff mypy

      - name: Run Ruff
        run: |
          cd healflow-backend
          ruff check src/ tests/ 2>&1 || true

  type-check:
    name: Type Check with mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd healflow-backend
          pip install mypy pydantic pydantic-settings

      - name: Run mypy
        run: |
          cd healflow-backend
          mypy src/ --strict --ignore-missing-imports 2>&1 || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd healflow-backend
          pip install ".[dev]"

      - name: Run pytest with coverage
        run: |
          cd healflow-backend
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --timeout=60
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/healflow
          DATABASE_SYNC_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/healflow
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci-32bytes

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./healflow-backend/coverage.xml
          fail_ci_if_error: false

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags
        id: meta
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "tags=${{ env.IMAGE_NAME }}:${GIT_SHA},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          echo "celery_tags=${{ env.CELERY_IMAGE_NAME }}:${GIT_SHA},${{ env.CELERY_IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: healflow-devops/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: healflow-devops/docker/Dockerfile.celery
          push: true
          tags: ${{ steps.meta.outputs.celery_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max