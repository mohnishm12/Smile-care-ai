# =============================================================================
# HealFlow AI — Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Add AlertManager targets here: ["alertmanager:9093"]

rule_files:
  - "alert.rules.yml"

scrape_configs:
  # Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI Backend metrics
  - job_name: "healflow-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "backend"

  # Celery Worker metrics
  - job_name: "healflow-celery"
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-worker:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "celery-worker"

  # Redis metrics (via redis_exporter)
  - job_name: "healflow-redis"
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: "healflow-postgres"
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "postgres"

  # Node metrics (host-level)
  - job_name: "healflow-nodes"
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "node-exporter"