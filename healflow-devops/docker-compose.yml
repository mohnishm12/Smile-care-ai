# =============================================================================
# HealFlow AI — Docker Compose (Production-shaped base)
# Services: migrate, backend, frontend, postgres, redis, celery-worker,
#           celery-beat, nginx, prometheus, grafana, otel-collector
#
# All relative paths resolve against THIS file's directory (healflow-devops/).
# Run from anywhere:  docker compose -f healflow-devops/docker-compose.yml up -d
# Dev extras (published DB/metrics ports): add -f healflow-devops/docker-compose.dev.yml
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healflow}
  DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healflow}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEBUG: ${DEBUG:-false}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}

services:
  # ---------- PostgreSQL with pgvector ----------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: healflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-healflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-healflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: healflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- One-shot DB migration runner ----------
  migrate:
    build:
      context: ..
      dockerfile: healflow-devops/docker/Dockerfile.backend
    container_name: healflow-migrate
    restart: "no"
    entrypoint: ["bash", "/opt/healflow/run-migrations.sh"]
    environment:
      <<: *backend-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./scripts/run-migrations.sh:/opt/healflow/run-migrations.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- FastAPI Backend ----------
  backend:
    build:
      context: ..
      dockerfile: healflow-devops/docker/Dockerfile.backend
    container_name: healflow-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: healflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Celery Worker ----------
  celery-worker:
    build:
      context: ..
      dockerfile: healflow-devops/docker/Dockerfile.celery
    container_name: healflow-celery-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: healflow-celery-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Celery Beat (Scheduler) ----------
  celery-beat:
    build:
      context: ..
      dockerfile: healflow-devops/docker/Dockerfile.celery
    container_name: healflow-celery-beat
    restart: unless-stopped
    entrypoint: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info", "--scheduler", "celery.beat.PersistentScheduler", "--schedule", "/tmp/celerybeat-schedule"]
    # The celery image's HEALTHCHECK pings workers; beat isn't a worker and
    # would report unhealthy forever — disable it here.
    healthcheck:
      disable: true
    environment:
      <<: *backend-env
      OTEL_SERVICE_NAME: healflow-celery-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Next.js Frontend ----------
  frontend:
    build:
      context: ..
      dockerfile: healflow-devops/docker/Dockerfile.frontend
      args:
        # Leave empty to use same-origin requests through the nginx proxy.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: healflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Nginx Reverse Proxy ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: healflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Prometheus (Monitoring) ----------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: healflow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- Grafana (Dashboards) ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: healflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - healflow-network

  # ---------- OpenTelemetry Collector ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: healflow-otel-collector
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    command:
      - "--config=/etc/otel-collector-config.yml"
    volumes:
      - ./monitoring/otel/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    logging: *default-logging
    networks:
      - healflow-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  healflow-network:
    driver: bridge
