[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healflow-backend"
version = "0.1.0"
description = "HealFlow AI backend — FastAPI + Celery"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "python-multipart==0.0.19",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.0.0",
    "pytest-timeout==2.3.1",
    "httpx==0.28.1",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

# `src` is itself the importable package (code does `from src.x import ...`),
# so install it as-is rather than remapping src/ contents to top level.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session — the module-level async engine's
# pooled connections must not outlive the loop they were created on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in argument defaults is the canonical FastAPI DI pattern
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
