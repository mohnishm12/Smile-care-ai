# =============================================================================
# HealFlow AI — Frontend CI/CD Pipeline
# Lint → Type Check → Build → Test → Deploy to Docker Hub
# =============================================================================

name: Frontend CI/CD

on:
  push:
    branches: [develop, main]
    paths:
      - "healflow-frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - "healflow-devops/docker/Dockerfile.frontend"
  pull_request:
    branches: [develop]
    paths:
      - "healflow-frontend/**"

env:
  REGISTRY: docker.io
  IMAGE_NAME: mohnishm12/healflow-frontend
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint with ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "healflow-frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd healflow-frontend
          npm ci --legacy-peer-deps

      - name: Run ESLint
        run: |
          cd healflow-frontend
          npm run lint

  type-check:
    name: Type Check with TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "healflow-frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd healflow-frontend
          npm ci --legacy-peer-deps

      - name: Run TypeScript type check
        run: |
          cd healflow-frontend
          npm run type-check

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "healflow-frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd healflow-frontend
          npm ci --legacy-peer-deps

      - name: Build Next.js app
        run: |
          cd healflow-frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: healflow-frontend/.next/

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags
        id: meta
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          echo "tags=${{ env.IMAGE_NAME }}:${GIT_SHA},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Build frontend image (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: healflow-devops/docker/Dockerfile.frontend
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: healflow-devops/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max